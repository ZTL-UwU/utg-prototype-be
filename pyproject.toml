[project]
name = "utg-backend"
version = "0.1.0"
description = "Django Ninja and PostgreSQL backend for UTG"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "django>=6.0,<6.1",
    "django-cors-headers>=4.9,<5",
    "django-ninja>=1.5,<2",
    "django-ninja-jwt>=5.4,<6",
    "psycopg[binary]>=3.3,<4",
    "whitenoise>=6.11,<7",
]

[dependency-groups]
dev = [
    "django-stubs>=5.2,<6",
    "pytest>=9.1.1",
    "pytest-django>=4.12.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.14,<1",
]

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]
ignore = ["DJ001"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py", "*_test.py"]
